name: postgres-server

services:
  postgres:
    image: postgres:18.4-trixie
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      - PGTZ=UTC
      - TZ=UTC
    env_file:
      - credentials.env
    ports:
      - '127.0.0.1:5432:5432'
    command:
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
    restart: on-failure
    healthcheck:
      test: pg_isready -d "$$POSTGRES_DB" -U "$$POSTGRES_USER"
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
